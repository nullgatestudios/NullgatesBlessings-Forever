<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nullgate's Blessings - Forever: a golden crown in a burst of holy light -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232d3d"/>
      <stop offset="1" stop-color="#0f141c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d27a"/>
      <stop offset="0.5" stop-color="#c9a54e"/>
      <stop offset="1" stop-color="#8a6a26"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.5" stop-color="#f2c740"/>
      <stop offset="1" stop-color="#a87412"/>
    </linearGradient>
    <radialGradient id="holy" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2b0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#f2c740" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- frame -->
  <rect x="20" y="20" width="472" height="472" rx="64" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="64" fill="none" stroke="url(#gold)" stroke-width="16"/>
  <rect x="44" y="44" width="424" height="424" rx="44" fill="none" stroke="#c9a54e" stroke-opacity="0.35" stroke-width="3"/>

  <circle cx="256" cy="250" r="200" fill="url(#holy)"/>

  <!-- light rays -->
  <g fill="#fff2b0" opacity="0.28">
    <path d="M256 250 L236 70 L276 70 Z"/>
    <path d="M256 250 L380 110 L404 138 Z"/>
    <path d="M256 250 L132 110 L108 138 Z"/>
    <path d="M256 250 L440 230 L440 270 Z"/>
    <path d="M256 250 L72 230 L72 270 Z"/>
  </g>

  <!-- crown -->
  <ellipse cx="256" cy="392" rx="120" ry="14" fill="#000000" opacity="0.35"/>
  <path d="M136 340 L120 192 L190 254 L256 150 L322 254 L392 192 L376 340 Z" fill="#f2c740" opacity="0.5" filter="url(#glow)"/>
  <path d="M136 340 L120 192 L190 254 L256 150 L322 254 L392 192 L376 340 Z" fill="url(#crown)" stroke="#6e4c0c" stroke-width="6" stroke-linejoin="round"/>
  <rect x="128" y="332" width="256" height="44" rx="10" fill="url(#crown)" stroke="#6e4c0c" stroke-width="6"/>
  <!-- jewels -->
  <circle cx="120" cy="186" r="14" fill="#fff2b0" stroke="#6e4c0c" stroke-width="5"/>
  <circle cx="256" cy="142" r="16" fill="#fff2b0" stroke="#6e4c0c" stroke-width="5"/>
  <circle cx="392" cy="186" r="14" fill="#fff2b0" stroke="#6e4c0c" stroke-width="5"/>
  <circle cx="256" cy="354" r="13" fill="#4fb4ff" stroke="#1f4e7a" stroke-width="4"/>
  <circle cx="190" cy="354" r="10" fill="#e04a4a" stroke="#7a1f1f" stroke-width="4"/>
  <circle cx="322" cy="354" r="10" fill="#e04a4a" stroke="#7a1f1f" stroke-width="4"/>
  <path d="M256 210 L256 300 M228 246 L284 246" stroke="#fff8d8" stroke-width="12" stroke-linecap="round"/>
  <path d="M150 220 L160 320" stroke="#ffffff" stroke-opacity="0.45" stroke-width="9" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M96 404 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 Z" fill="#fff2b0"/>
  <path d="M414 404 l6 15 l15 6 l-15 6 l-6 15 l-6 -15 l-15 -6 l15 -6 Z" fill="#fff2b0"/>
</svg>
